spring:
  application:
    name: rest-service

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true

server:
  port: ${REST_SERVICE_PORT}

logging:
  file:
    path: ./logs
    name: ${logging.file.path}/rest-service.log
  level:
    root: INFO
  log4j2:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 5

salt:
  doc: ${SALT_DOC}
  photo: ${SALT_PHOTO}
  user: ${SALT_USER}