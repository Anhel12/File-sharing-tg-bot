spring:
  application:
    name: dispatcher
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}
    queues:
      text-message-update: ${RABBIT_TEXT_MESSAGE_UPDATE_QUEUE}
      doc-message-update: ${RABBIT_DOC_MESSAGE_UPDATE_QUEUE}
      photo-message-update: ${RABBIT_PHOTO_MESSAGE_UPDATE_QUEUE}
      answer-message: ${RABBIT_ANSWER_MESSAGE_QUEUE}

telegram:
  bot:
    username: ${TG_BOT_NAME}
    token: ${TG_BOT_TOKEN}
    uri: ${TG_BOT_URI}

server:
  port: ${DISPATCHER_PORT}
  ssl:
    enabled: false

logging:
  file:
    path: ./logs
    name: ${logging.file.path}/dispatcher.log
  level:
    root: warn
  log4j2:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 5

