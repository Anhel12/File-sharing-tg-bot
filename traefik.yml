api:
  dashboard: true
  debug: true
entryPoints:
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"
  websecure8:
    address: ":8443"
  websecure9:
    address: ":9443"
serversTransport:
  insecureSkipVerify: true
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  file:
    filename: /tls.yml
certificatesResolvers:
  le-tlsalpn:
    acme:
      email: soleniyogurecbot@gmail.com
      storage: /letsencrypt/acme.json
      tlsalpnchallenge: true
log:
  level: "DEBUG"
  filePath: "/var/log/traefik/traefik.log"
accessLog:
  filePath: "/var/log/traefik/access.log"