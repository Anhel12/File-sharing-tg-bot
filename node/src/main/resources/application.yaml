spring:
  application:
    name: node
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}
    queues:
      text-message-update: ${RABBIT_TEXT_MESSAGE_UPDATE_QUEUE}
      doc-message-update: ${RABBIT_DOC_MESSAGE_UPDATE_QUEUE}
      photo-message-update: ${RABBIT_PHOTO_MESSAGE_UPDATE_QUEUE}
      answer-message: ${RABBIT_ANSWER_MESSAGE_QUEUE}
      registration-mail: ${RABBIT_REGISTRATION_MAIL_QUEUE}

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: ${POSTGRES_DRIVER}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  liquibase:
    enabled: true


server:
  port: ${NODE_PORT}
  tomcat:
    threads:
      max: 1000

logging:
  file:
    path: ./logs
    name: ${logging.file.path}/node.log
  level:
    root: debug
  log4j2:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 5

telegram:
  bot:
    token: ${TG_BOT_TOKEN}
  service:
    file_info:
      uri: ${TG_BOT_FILE_INFO_URI}
    file_storage:
      uri: ${TG_BOT_FILE_STORAGE_URI}

link:
  address: ${TG_BOT_URI:http://localhost:8083}
salt:
  doc: ${SALT_DOC}
  photo: ${SALT_PHOTO}
  user: ${SALT_USER}