server:
  port: ${MAIL_SERVICE_PORT}
spring:
  mail:
    port: ${MAIL_PORT}
    host: ${MAIL_HOST}
    protocol: ${MAIL_PROTOCOL}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT}
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}
    queues:
      registration-mail: ${RABBIT_REGISTRATION_MAIL_QUEUE}

service:
  activation:
    uri: ${ACTIVATION_URI}
